plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

application {
    mainClass = 'Extant'
}

tasks.named('shadowJar') {
    archiveClassifier = 'all'
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
